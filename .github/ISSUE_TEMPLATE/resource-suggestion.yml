name: Resource Suggestion
description: Suggest a Rust book, course, tutorial, conference, community, podcast, or newsletter.
title: "[Resource Suggestion]: "
labels:
  - resource suggestion

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a resource for Awesome Rust!

        Before submitting, make sure to read our [Contributing Guidelines](../../CONTRIBUTING.md).

  - type: input
    id: resource-name
    attributes:
      label: Resource Name
      placeholder: "Example: The Rust Programming Language"
    validations:
      required: true

  - type: input
    id: resource-url
    attributes:
      label: Resource URL
      description: Provide the official website or direct link to the resource.
      placeholder: https://example.com
    validations:
      required: true

  - type: dropdown
    id: resource-category
    attributes:
      label: Resource Category
      description: Select the most appropriate category from the README.
      options:
        - Books
        - Courses
        - Tutorials
        - Conferences
        - Communities
        - Podcasts
        - Newsletters
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what the resource offers and how it benefits Rust developers. Write in clear and concise English.
      placeholder: Describe the resource and its main benefits.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Checklist
      options:
        - label: I have read the Contributing Guidelines.
          required: true
