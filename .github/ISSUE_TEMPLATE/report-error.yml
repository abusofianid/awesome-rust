name: Report an Error
description: Report incorrect information, broken links, duplicate entries, or other issues in Awesome Rust.
title: "[Error Report]: "
labels:
  - error report

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Awesome Rust!

        Use this form to report incorrect information, broken links, outdated entries, duplicate projects, or other issues in the repository.

  - type: dropdown
    id: error-type
    attributes:
      label: Error Type
      description: Select the type of issue you want to report.
      options:
        - Broken Link
        - Incorrect Description
        - Outdated Information
        - Inactive or Archived Project
        - Project No Longer Meets Requirements
        - Duplicate Entry
        - Incorrect Category
        - Other
    validations:
      required: true

  - type: textarea
    id: error-description
    attributes:
      label: Description of the Error
      description: Explain what is incorrect and why it should be corrected.
      placeholder: Describe the issue clearly.
    validations:
      required: true

 

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked that this issue has not already been reported.
          required: true
