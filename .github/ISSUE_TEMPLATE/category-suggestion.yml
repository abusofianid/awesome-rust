name: Category Suggestion
description: Suggest a new category or subcategory for Awesome Rust.
title: "[Category Suggestion] "
labels:
  - category suggestion

body:
  - type: dropdown
    id: request_type
    attributes:
      label: Request Type
      description: What type of category are you proposing?
      options:
        - New Main Category
        - New Subcategory
    validations:
      required: true

  - type: dropdown
    id: parent_category
    attributes:
      label: Parent Category
      description: Select the existing main category where the proposed subcategory belongs. Select Not Applicable for a new main category.
      options:
        - Not Applicable
        - AI & Machine Learning
        - Web Development
        - Networking & Communication
        - Database & Storage
        - Data & Science
        - Developer Tools
        - DevOps & Cloud
        - CLI & GUI
        - Media & Graphics
        - Rust Language
        - Rust Toolchain
        - Embedded & Hardware
        - Security
        - Operating Systems & Systems Programming
        - Resources
    validations:
      required: true

  - type: input
    id: category_name
    attributes:
      label: Proposed Category Name
      description: Enter the name of the proposed category or subcategory.
      placeholder: e.g. Robotics
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the purpose and scope of the proposed category.
      placeholder: Explain what types of projects or resources belong in this category.
    validations:
      required: true
