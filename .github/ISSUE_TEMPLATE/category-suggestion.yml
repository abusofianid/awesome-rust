
name: Category Request
description: Suggest a new category or subcategory for Awesome Rust.
title: "[Category Request] "
labels:
  - category request

body:
  - type: dropdown
    id: request_type
    attributes:
      label: Request Type
      description: What type of category are you proposing?
      options:
        - New Main Category
        - New Subcategory
    validations:
      required: true

  - type: dropdown
    id: parent_category
    attributes:
      label: Parent Category
      description: Select the existing main category where the proposed subcategory belongs. Select Not Applicable for a new main category.
      options:
        - Not Applicable
        - AI & Machine Learning
        - Web Development
        - Networking & Communication
        - Database & Storage
        - Data & Science
        - Developer Tools
        - DevOps & Cloud
        - CLI & GUI
        - Media & Graphics
        - Rust Language
        - Rust Toolchain
        - Embedded & Hardware
        - Security
        - Operating Systems & Systems Programming
        - Resources
    validations:
      required: true

  - type: input
    id: category_name
    attributes:
      label: Proposed Category Name
      description: Enter the name of the proposed category or subcategory.
      placeholder: e.g. Robotics
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the purpose and scope of the proposed category.
      placeholder: Explain what types of projects or resources belong in this category.
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Why Is This Category Needed?
      description: Explain why this category should be added to Awesome Rust.
      placeholder: Describe its relevance to the Rust ecosystem and why existing categories are insufficient.
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Suggested Projects or Resources
      description: Provide examples of projects or resources that would belong in this category.
      placeholder: |
        - Project or resource name: URL
        - Project or resource name: URL
    validations:
      required: false

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: Provide any other relevant details.
    validations:
      required: false
